dependencies:
  # espressif/esp_codec_dev's own CMakeLists.txt unconditionally REQUIRES
  # esp_hal_ana_conv, which self-excludes on the linux target (its
  # CMakeLists.txt does `if(target STREQUAL "linux") return()` before ever
  # calling idf_component_register) -- so on linux it's simply never
  # registered, and esp_codec_dev's unconditional REQUIRES on it fails
  # dependency resolution before set(COMPONENTS ...) even gets a chance to
  # exclude audio_pipeline (which is the only consumer) from the linux
  # build. Gate it the same way as esp-sr below.
  espressif/esp_codec_dev:
    version: ">=1.5.1"
    rules:
      - if: "target != linux"
  # esp-sr's own manifest depends on espressif/esp-dl >=3.3.10, which has no
  # version supporting the "linux" preview target (idf.py --preview
  # set-target linux, used by Task 1's host-test flow / protocol's test/
  # dir). Gate this dependency to real chip targets so `idf.py --preview
  # set-target linux` keeps resolving; main/CMakeLists.txt already only adds
  # `wake_word` (which REQUIRES esp-sr) to main_reqs outside the linux branch.
  espressif/esp-sr:
    version: ">=2.5.0"
    rules:
      - if: "target != linux"
  # esp_websocket_client (part of espressif/esp-protocols) pulls in
  # esp_http_client/tcp_transport/esp-tls, none of which target the "linux"
  # preview target used by Task 1's host-test flow. Gate it the same way as
  # esp_codec_dev/esp-sr above so `idf.py --preview set-target linux` keeps
  # resolving; main/CMakeLists.txt and the root CMakeLists.txt's linux
  # COMPONENTS list already exclude server_client (which REQUIRES
  # esp_websocket_client) from the linux build.
  espressif/esp_websocket_client:
    version: "*"
    rules:
      - if: "target != linux"
  # network_provisioning depends on protocomm/protobuf components that are
  # not built for the "linux" preview target used by Task 1/2/7's host-test
  # flow. Gate it the same way as esp_codec_dev/esp-sr/esp_websocket_client
  # above so `idf.py --preview set-target linux` keeps resolving.
  espressif/network_provisioning:
    version: "^1.1.0"
    rules:
      - if: "target != linux"
  # RMT-backed WS2812 driver for the 7-LED chain on GPIO38 (status_led
  # component). Not linux-buildable (depends on the RMT peripheral driver).
  espressif/led_strip:
    version: "^3.0.0"
    rules:
      - if: "target != linux"
